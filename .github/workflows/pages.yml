name: Deploy Taiga preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - name: Unpack the published preview
        run: |
          curl -fL --retry 3 -o preview.zip https://github.com/miromanof/taiga-site-preview/releases/download/preview-v2/TAIGA-GITHUB-PAGES.zip
          unzip -q preview.zip -d site
          test -f site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
